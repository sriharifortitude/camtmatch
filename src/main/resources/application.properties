spring.application.name=camtmatch
# No default: the application refuses to start without a token of 32+ characters.
camtmatch.api-token=${CAMTMATCH_API_TOKEN}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5437/camtmatch}
spring.datasource.username=${DATABASE_USER:camtmatch}
spring.datasource.password=${DATABASE_PASSWORD:camtmatch_local_dev}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
server.error.include-message=never
spring.mvc.problemdetails.enabled=true
